name: 📲 Generar contenido Instagram

on:
  # Lunes, Miércoles y Viernes a las 7am UTC (4am Costa Rica)
  schedule:
    - cron: "0 7 * * 1"
    - cron: "0 7 * * 3"
    - cron: "0 7 * * 5"

  # También se puede correr manualmente
  workflow_dispatch:

jobs:
  generate-content:
    name: Generar posts y stories
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar nodemailer
        run: npm install nodemailer

      - name: Generar contenido con IA
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: node scripts/generate-content.js

      - name: Commit contenido generado
        run: |
          git config user.name "curso-ai-bot"
          git config user.email "bot@curso-ai.com"
          git add -f content/
          git status
          git diff --staged --quiet || git commit -m "📲 Contenido Instagram — $(date +'%Y-%m-%d')"
          git push || echo "Nada que pushear"

      - name: Resumen
        run: echo "✅ Contenido generado y enviado a agent.ai.cr@gmail.com"
